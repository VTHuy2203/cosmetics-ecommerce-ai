<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/TTTT/(Image_upload|WebBanHangMyPham/Image_upload|AdminManage/src/(Products/IMG_Products|Brands/IMG_Brand|Categorys/IMG_Category|News_Posts/IMG_News_Posts|ReturnRefundAttachments))">
        Options -Indexes
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|py|sh|shtml|html?|svg|js|mjs|xml)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    <DirectoryMatch "^/var/www/html/TTTT/(config|database|bin|vendor|storage|WebSocketServer|WebBanHangMyPham/src/(ML|RAG|uploads))(/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(?i)^(\.env(\..*)?|composer\.(json|lock)|.*\.(sql|sqlite3?|db|log))$">
        Require all denied
    </FilesMatch>

    RemoteIPHeader CF-Connecting-IP

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
